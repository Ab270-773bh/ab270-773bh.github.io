const {error}=await sb.from('vendor_requests').insert({name:n,phone:p,email:e,user_id:r.data.user?r.data.user.id:null});
m.innerHTML=error?t('err'):t('sent')+'<br><a class=btn onclick="go(\'support\')">'+t('contactus')+'</a>'}
function supp(){const s=D.set;return `<h1 class=pt>${t('support')}</h1><p class=mut>${t('supsub')}</p><div class=row style="align-items:flex-start"><div class=box><h3>${t('contactus')}</h3>${s.sw?`<p><a class=btn href="https://wa.me/${esc(s.sw.replace(/\D/g,''))}" target=_blank>WhatsApp</a></p>`:''}${s.sp?`<p>📞 <a href="tel:${esc(s.sp)}" dir=ltr>${esc(s.sp)}</a></p>`:''}${s.se?`<p>✉ <a href="mailto:${esc(s.se)}" dir=ltr>${esc(s.se)}</a></p>`:''}${/^https?:\/\//.test(s.si||'')?`<p><a class="btn o" href="${esc(s.si)}" target=_blank rel=noopener>Instagram</a></p>`:''}${/^https?:\/\//.test(s.sx||'')?`<p><a class="btn o" href="${esc(s.sx)}" target=_blank rel=noopener>X / Twitter</a></p>`:''}</div><div class=box><input id=tn placeholder="${t('name')}"><input id=tp placeholder="${t('phone')}" dir=ltr><textarea id=tm rows=4 placeholder="${t('msg')}"></textarea><button onclick="tk()">${t('send')}</button><p id=te></p></div></div>`}
async function tk(){if(!$('#tm').value)return;const {error}=await sb.from('support_tickets').insert({name:$('#tn').value,phone:$('#tp').value,message:$('#tm').value});$('#te').textContent=error?t('err'):t('sentok')}
function rz(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.8)};i.src=URL.createObjectURL(f)})}
async function ap(){const n=$('#pn').value,vid=S.role=='owner'?$('#pv').value:S.vid;if(!n||!vid)return;const b=$('#pb');b.disabled=true;const urls=[];let k=0;
for(const f of [...$('#pf').files].slice(0,8)){const bl=await rz(f),path=`${vid}/${Date.now()}-${k++}.jpg`;const u=await sb.storage.from('products').upload(path,bl,{contentType:'image/jpeg'});if(!u.error)urls.push(sb.storage.from('products').getPublicUrl(path).data.publicUrl)}
const {error}=await sb.from('products').insert({vendor_id:vid,name:n,description:$('#pd').value,price:+$('#pr').value||0,images:urls});b.disabled=false;if(error){alert(t('err'));return}await load();R()}
async function dp(id){await sb.from('products').delete().eq('id',id);await load();R()}
const ords=l=>l&&l.length?`<table>${l.map(x=>`<tr><td>${(x.created_at||'').slice(0,10)}</td><td>${esc(x.customer_name)} ${esc(x.customer_phone)}</td><td>${(x.items||[]).map(esc).join('، ')}</td><td>$${(+x.total).toFixed(2)}</td></tr>`).join('')}</table>`:`<p>${t('empty')}</p>`;
function pform(sel){return `<div class="box wide"><h3>${t('addp')}</h3>${sel?`<select id=pv>${D.vendors.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select>`:''}<input id=pn placeholder="${t('name')}"><textarea id=pd rows=3 placeholder="${t('desc')}"></textarea><input id=pr type=number step=0.01 placeholder="${t('price')}"><label>${t('photos')}<input id=pf type=file accept="image/*" multiple></label><button id=pb onclick="ap()">${t('addp')}</button></div>`}
function vpanel(){if(!S||S.role!='vendor')return authf('v');
return `<h1>${esc(S.name)} · 📞 ${esc(S.phone)}</h1>${pbox()}${pform()}<h3>${t('mine')}</h3><table>${D.products.filter(p=>p.v==S.vid).map(p=>`<tr><td>${esc(p.name)}</td><td>$${(+p.price).toFixed(2)}</td><td><button onclick="ep('${p.id}')">${t('edit')}</button> <button class=d onclick="dp('${p.id}')">${t('del')}</button></td></tr>`).join('')}</table><h3>${t('orders')}</h3>${ords(X.orders)}`}
async function av(){const n=$('#vn').value,p=$('#vp').value,e=ce($('#ve').value),w=$('#vw').value;if(!n||!p||!e||!w)return;
const r=await sb2.auth.signUp({email:e,password:w,options:{data:{name:n}}});if(r.error||!r.data.user){alert(r.error?errm(r.error):t('err'));return}
const {error}=await sb.from('vendors').insert({name:n,phone:p,user_id:r.data.user.id});if(error){alert(t('err'));return}await load();R()}
async function rq(id,y){const r=X.reqs.find(x=>x.id==id);if(y&&r.user_id){const {error}=await sb.from('vendors').insert({name:r.name,phone:r.phone,user_id:r.user_id});if(error){alert(t('err'));return}}await sb.from('vendor_requests').delete().eq('id',id);await load();R()}
async function dv(id){await sb.from('vendors').delete().eq('id',id);await load();R()}
async function uploadStoreImage(inputId,key){
 if(!S||S.role!=='owner'){alert('يجب تسجيل الدخول بحساب المالك أولاً.');return}
 const input=$('#'+inputId),file=input&&input.files&&input.files[0];
 if(!file){alert('اختر صورة من هاتفك أولاً.');return}
 if(!/^image\/(jpeg|png|webp|gif)$/i.test(file.type)){alert('اختر صورة بصيغة JPG أو PNG أو WEBP أو GIF.');return}
 if(file.size>8*1024*1024){alert('حجم الصورة أكبر من 8 ميغابايت. اختر صورة أصغر.');return}
 const button=input.closest('.media-upload-row')?.querySelector('button')||input.parentElement?.nextElementSibling;
 const oldText=button?.textContent;if(button){button.disabled=true;button.textContent='جارٍ رفع الصورة…'}
 try{
  const ext=({ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'})[file.type]||'jpg';
  const path=`store-assets/${key}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {data:upData,error:upErr}=await sb.storage.from('products').upload(path,file,{contentType:file.type,upsert:false,cacheControl:'3600'});
  if(upErr){let hint=upErr.message||'خطأ غير معروف';if(/bucket/i.test(hint))hint+=' — مساحة التخزين products غير موجودة أو اسمها مختلف.';else if(/policy|permission|row.level|not authorized/i.test(hint))hint+=' — صلاحيات Storage تمنع حساب المالك من الرفع.';throw new Error(hint)}
  const {data:pub}=sb.storage.from('products').getPublicUrl(upData.path||path);const url=pub?.publicUrl;
  if(!url)throw new Error('تعذر إنشاء رابط عام للصورة. تأكد أن مساحة products عامة (Public).');
  const {error:dbErr}=await sb.from('settings').upsert({key,value:url},{onConflict:'key'});
  if(dbErr)throw new Error('رُفعت الصورة لكن لم يُحفظ رابطها في جدول settings: '+dbErr.message);
  await load();R();alert(key==='store_bg'?'تم رفع الخلفية وحفظها بنجاح.':'تم رفع البانر وحفظه بنجاح.');
 }catch(e){alert('لم يكتمل رفع الصورة: '+(e.message||e)+'\n\nإذا ظهرت رسالة صلاحيات، يلزم السماح بالرفع إلى bucket باسم products في Supabase Storage.');}
 finally{if(button){button.disabled=false;button.textContent=oldText||'رفع الصورة'}}
}
async function ss2(){await sb.from('settings').upsert([['sw','#sw'],['sp','#sp'],['se','#se'],['si','#si'],['st','#st'],['sx','#sx']].map(([k,i])=>({key:k,value:$(i).value})));if($('#op').value)await sb.auth.updateUser({password:$('#op').value});await load();R()}
function opanel(){if(!S||S.role!='owner')return authf('o');const s=D.set;
return `<h1>${t('set')}</h1><div class="box wide"><h3>${t('reqs')}</h3>${(X.reqs||[]).map(r=>`<div class=row><b>${esc(r.name)}</b> ${esc(r.phone)} ${esc(r.email)} <button onclick="rq('${r.id}',1)">${t('ok')}</button><button class=d onclick="rq('${r.id}',0)">${t('no')}</button></div>`).join('')||`<p>${t('empty')}</p>`}</div>
<div class="box wide"><h3>${t('addv')}</h3><div class=row><input id=vn placeholder="${t('name')}" style="width:150px"><input id=vp placeholder="${t('phone')}" dir=ltr style="width:150px"><input id=ve placeholder="${t('mail')}" dir=ltr style="width:180px"><input id=vw placeholder="${t('pass')}" dir=ltr style="width:140px"><button onclick="av()">${t('addv')}</button></div><table>${D.vendors.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.phone)}</td><td>${D.products.filter(p=>p.v==v.id).length}</td><td><button onclick="ev('${v.id}')">${t('edit')}</button> <button class=d onclick="dv('${v.id}')">${t('del')}</button></td></tr>`).join('')}</table></div>
${D.vendors.length?pform(1):''}
<div class="box wide"><h3>${t('prods')}</h3><table>${D.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(vn(p.v).name)}</td><td>$${(+p.price).toFixed(2)}</td><td><button onclick="ep('${p.id}')">${t('edit')}</button> <button class=d onclick="dp('${p.id}')">${t('del')}</button></td></tr>`).join('')}</table></div>
<div class="box wide"><h3>${t('orders')}</h3>${ords(X.orders)}</div>
<div class="box wide"><h3>${t('tickets')}</h3>${(X.tix||[]).map(x=>`<div class=row><b>${esc(x.name)}</b><span dir=ltr>${esc(x.phone)}</span><span>${esc(x.message)}</span></div>`).join('')||`<p>${t('empty')}</p>`}</div>
<div class="box wide"><h3>🖼️ صور وخلفيات المتجر</h3><p class=mut>ارفع صورة خلفية عامة وصورة البانر الرئيسي من هاتفك. ستُحفظ الصور في مساحة التخزين وتظهر للزوار.</p><div class="row media-upload-row"><label style="flex:1">صورة خلفية المتجر<input id=storebgfile type=file accept="image/*"></label><button onclick="uploadStoreImage('storebgfile','store_bg')">رفع الخلفية</button></div><div class="row media-upload-row"><label style="flex:1">صورة البانر الرئيسي<input id=storeherofile type=file accept="image/*"></label><button onclick="uploadStoreImage('storeherofile','hero_image')">رفع البانر</button></div><div id=store-media-preview>${s.store_bg?`<div><small>الخلفية الحالية</small><img src="${esc(s.store_bg)}"></div>`:''}${s.hero_image?`<div><small>البانر الحالي</small><img src="${esc(s.hero_image)}"></div>`:''}</div><p class=mut>ملاحظة: تُرفع الصور إلى مساحة products الحالية في Supabase حتى لا تحتاج إلى إنشاء قاعدة بيانات جديدة.</p></div>
<div class="box"><h3>${t('support')}</h3><input id=sw placeholder="${t('wa')}" value="${esc(s.sw||'')}" dir=ltr><input id=sp placeholder="${t('phone')}" value="${esc(s.sp||'')}" dir=ltr><input id=se placeholder="${t('mail')}" value="${esc(s.se||'')}" dir=ltr><input id=si placeholder="Instagram URL" value="${esc(s.si||'')}" dir=ltr><input id=st placeholder="Telegram URL" value="${esc(s.st||'')}" dir=ltr><input id=sx placeholder="X / Twitter URL" value="${esc(s.sx||'')}" dir=ltr><input id=op type=password placeholder="${t('pwd2')}" dir=ltr><button onclick="ss2()">${t('save')}</button></div>`}
function pbox(){return `<div class=box><h3>${t('prof')}</h3><input id=fn value="${esc(S.name)}" placeholder="${t('name')}"><input id=fp value="${esc(S.phone)}" placeholder="${t('phone')}" dir=ltr><input id=fe value="${esc(S.email||'')}" placeholder="${t('mail')}" dir=ltr type=email><input id=fw type=password placeholder="${t('pwd2')}" dir=ltr><button onclick="sp2()">${t('save')}</button></div>`}
async function sp2(){const n=$('#fn').value,p=$('#fp').value,e=ce($('#fe').value),w=$('#fw').value;if(!n||!p)return;
let r=await sb.from('vendors').update({name:n,phone:p}).eq('id',S.vid);if(r.error){alert(errm(r.error));return}
const u={};if(e&&e!=S.email)u.email=e;if(w){if(w.length<6){alert(t('pw6'));return}u.password=w}
if(Object.keys(u).length){r=await sb.auth.updateUser(u);if(r.error){alert(errm(r.error));return}}
await who();await load();alert(t('saved'));R()}
async function ep(id){const p=D.products.find(x=>x.id==id);const n=prompt(t('name'),p.name);if(n===null)return;const d=prompt(t('desc'),p.desc||'');if(d===null)return;const pr=prompt(t('price'),p.price);if(pr===null)return;const {error}=await sb.from('products').update({name:n,description:d,price:+pr||0}).eq('id',id);if(error){alert(errm(error));return}await load();R()}
async function ev(id){const v=vn(id);const n=prompt(t('name'),v.name);if(n===null)return;const p=prompt(t('phone'),v.phone);if(p===null)return;const {error}=await sb.from('vendors').update({name:n,phone:p}).eq('id',id);if(error){alert(errm(error));return}await load();R()}
function gate(){return `<div id=gate><div class=gem>💎</div><h1 class=logo>${t('brand')}</h1><p>${t('gate')}</p><div class=row><button onclick="cty('sy')">${t('sy')}</button><button onclick="cty('iq')">${t('iq')}</button><button onclick="cty('ir')">${t('ir')}</button></div></div>`}
function cty(c){localStorage.setItem('c',c);R()}
async function R(){document.documentElement.lang=L;document.documentElement.dir=L=='en'?'ltr':'rtl';document.body.dataset.l=L;
if(!localStorage.getItem('c')){$('#app').innerHTML=gate();return}
const h=(location.hash||'#/').slice(2).split('/'),p=h[0];
if(S&&S.role=='owner'&&p=='jas-portal'){const [a,b,c]=await Promise.all([sb.from('vendor_requests').select('*'),sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('support_tickets').select('*').order('created_at',{ascending:false})]);X={reqs:a.data||[],orders:b.data||[],tix:c.data||[]}}
else if(S&&S.role=='vendor'&&p=='vendor'){X={orders:(await sb.from('orders').select('*').eq('vendor_id',S.vid).order('created_at',{ascending:false})).data||[]}}
let m;
if(p=='v')m=vstore(h[1]);else if(p=='p')m=pp(h[1]);else if(p=='cart')m=cartv();else if(p=='favorites')m=favoritesv();else if(p=='login')m=loginp();else if(p=='register')m=loginp(1);else if(p=='vendor-login')m=authf('v');else if(p=='join')m=joinp();else if(p=='support')m=supp();else if(p=='vendor')m=vpanel();else if(p=='jas-portal')m=opanel();else m=home();
$('#app').innerHTML=`<div id=store-bg-layer></div><header><span class=logo onclick="go('')">💎 ${t('brand')}</span><nav>${nav()}</nav></header><main>${m}</main>${foot()}<div class=bottom-nav><a onclick="go('')"><span>⌂</span>الرئيسية</a><a onclick="jumpSections()"><span>▦</span>الأقسام</a><a onclick="go('favorites')"><span>♡</span>المفضلة</a><a onclick="go('cart')"><span>🛒</span>السلة</a><a onclick="go(S?(S.role==='owner'?'jas-portal':'vendor'):'login')"><span>♙</span>حسابي</a></div>${supportFloat()}`;const bg=D.set.store_bg||'';document.body.style.setProperty('background-image',bg?'linear-gradient(rgba(0,0,0,.58),rgba(0,0,0,.58)),url("'+bg.replace(/["\\]/g,'')+'")':'radial-gradient(ellipse at 50% 0,#292016 0,transparent 42%),linear-gradient(135deg,#050505,#101010 48%,#050505)','important');document.body.style.backgroundSize=bg?'cover':'auto';document.body.style.backgroundPosition=bg?'center':'initial';document.body.style.backgroundAttachment='fixed'}
(async()=>{await who();await load();R()})();
</script>
