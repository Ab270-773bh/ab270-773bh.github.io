  if(upErr){let hint=upErr.message||'خطأ غير معروف';if(/bucket/i.test(hint))hint+=' — مساحة التخزين products غير موجودة أو اسمها مختلف.';else if(/policy|permission|row.level|not authorized/i.test(hint))hint+=' — صلاحيات Storage تمنع حساب المالك من الرفع.';throw new Error(hint)}
  const {data:pub}=sb.storage.from('products').getPublicUrl(upData.path||path);const url=pub?.publicUrl;
  if(!url)throw new Error('تعذر إنشاء رابط عام للصورة. تأكد أن مساحة products عامة (Public).');
  const {error:dbErr}=await sb.from('settings').upsert({key,value:url},{onConflict:'key'});
  if(dbErr)throw new Error('رُفعت الصورة لكن لم يُحفظ رابطها في جدول settings: '+dbErr.message);
  await load();R();alert(key==='store_bg'?'تم رفع الخلفية وحفظها بنجاح.':'تم رفع البانر وحفظه بنجاح.');
 }catch(e){alert('لم يكتمل رفع الصورة: '+(e.message||e)+'\n\nإذا ظهرت رسالة صلاحيات، يلزم السماح بالرفع إلى bucket باسم products في Supabase Storage.');}
 finally{if(button){button.disabled=false;button.textContent=oldText||'رفع الصورة'}}
}

async function uploadVendorAvatar(){
 if(!S||S.role!=='vendor'){alert('يجب تسجيل الدخول بحساب البائع.');return}
 const input=$('#vendor-avatar-file'),file=input?.files?.[0];if(!file){alert('اختر صورة أولاً.');return}
 if(!/^image\/(jpeg|png|webp)$/i.test(file.type)){alert('الصيغة المسموحة JPG أو PNG أو WEBP فقط.');return}
 if(file.size>5*1024*1024){alert('حجم الصورة يجب ألا يتجاوز 5 ميغابايت.');return}
 const button=input.closest('.box')?.querySelector('button');if(button){button.disabled=true;button.textContent='جارٍ الرفع…'}
 try{
  const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type];
  const path=`vendor-avatars/${S.vid}-${Date.now()}.${ext}`;
  const {data,error}=await sb.storage.from('products').upload(path,file,{contentType:file.type,upsert:false,cacheControl:'3600'});
  if(error)throw error;
  const {data:pub}=sb.storage.from('products').getPublicUrl(data.path||path);
  const url=pub?.publicUrl;if(!url)throw new Error('تعذر إنشاء رابط الصورة');
  const {error:saveError}=await sb.from('settings').upsert({key:'vendor_avatar_'+S.vid,value:url});
  if(saveError)throw saveError;
  await load();alert('تم حفظ صورة الحساب.');R();
 }catch(e){alert('تعذر رفع الصورة: '+(e.message||'خطأ غير معروف'))}
 finally{if(button){button.disabled=false;button.textContent='رفع صورة الحساب'}}
}
